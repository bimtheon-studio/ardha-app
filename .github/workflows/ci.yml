# CI d'Ardha (PLAN §8) : types, lint, contrôle « base bête », tests unitaires et d'intégration sur
# la stack Docker (migrations rejouées depuis une base vide), build, tests e2e dans Chromium, image
# de production construite et démarrée contre la stack (lot LD), puis publiée sur ghcr.io : l'image
# testée, pas une autre construction.
# Chaque étape se rejoue en local avec la même commande `pnpm`.
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Publication de l'image sur ghcr.io avec le GITHUB_TOKEN (aucun jeton personnel).
  packages: write

env:
  IMAGE_REPOSITORY: ghcr.io/bimtheon-studio/ardha
  # Le commit testé et publié : la tête de la PR (pas le commit de fusion que GitHub construit par
  # défaut), pour que l'étiquette sha-<7> désigne exactement ce commit.
  COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.COMMIT }}

      # Node et pnpm aux versions de mise.toml.
      - uses: jdx/mise-action@v3

      - name: Dépendances
        run: pnpm install --frozen-lockfile

      - name: Lint (et frontières de l'architecture)
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Doctrine « base bête » — migrations
        run: pnpm doctrine

      - name: Stack (Postgres, Redis, MinIO), migrations depuis zéro, seed
        run: pnpm start --infra

      - name: Doctrine « base bête » — schéma migré
        run: pnpm doctrine --base

      - name: Tests (outils, back, front) et seuils de couverture
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Chromium des tests e2e
        run: pnpm exec playwright install --with-deps chromium

      # Stack jetable (base ardha_e2e, sources enregistrées, tuiles servies par le test) : sans Internet.
      - name: Tests e2e
        run: pnpm test:e2e
        env:
          # Le front vient d'être construit ; le Chromium de Playwright plutôt que celui du système.
          E2E_SKIP_FRONT_BUILD: '1'
          ARDHA_CHROMIUM: ''

      # Image once (/up, front servi par l'API, connexion, seed, sauvegarde et restauration, arrêt
      # propre) et script serveur ardha-env, avec un faux once qui lance cette image.
      - name: Déploiement (image, ardha-env)
        run: pnpm test:deploy
        env:
          ARDHA_IMAGE: ardha:ci

      # Ni les PR venues d'un fork (dépôt public : pas de droits d'écriture pour elles), ni rien
      # d'autre qu'une PR ou master.
      - name: Connexion à ghcr.io
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Étiquettes : sha-<7> (immuable, celle que l'on déploie), et pr-<n> ou master (mobiles).
      - name: Publication de l'image
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          MOVING_TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'master' }}
        run: |
          for tag in "sha-${COMMIT::7}" "$MOVING_TAG"; do
            docker tag ardha:ci "$IMAGE_REPOSITORY:$tag"
            docker push --quiet "$IMAGE_REPOSITORY:$tag"
          done
          echo "Image publiée : $IMAGE_REPOSITORY:sha-${COMMIT::7} ($MOVING_TAG)" >> "$GITHUB_STEP_SUMMARY"

      - name: Rapport e2e
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Journaux de la stack
        if: failure()
        run: docker compose logs --no-color --tail=200
