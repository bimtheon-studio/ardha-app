# Environnements de PR sur le serveur once (lot LD) : supprimé à la fermeture de la PR ; chaque nuit,
# balayage de ceux dont la PR n'est plus ouverte (fermeture manquée, échec). Par la clé SSH de la CI,
# dont la commande forcée (`ardha-env ci`) n'accepte que ces opérations.
name: Environments

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  cleanup:
    # Interrupteur : variable du dépôt DEPLOY_ONCE=true, posée une fois la clé SSH de la CI installée.
    if: vars.DEPLOY_ONCE == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: deploy-pr-${{ github.event.number || 'balayage' }}
      cancel-in-progress: false
    steps:
      - name: Accès SSH au serveur (clé à commande forcée, ardha-env ci)
        env:
          ONCE_SSH_KEY: ${{ secrets.ONCE_SSH_KEY }}
          ONCE_KNOWN_HOSTS: ${{ secrets.ONCE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ONCE_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$ONCE_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Suppression de l'environnement de la PR fermée
        if: github.event_name == 'pull_request'
        run: |
          name="pr-${{ github.event.number }}"
          if ssh -o BatchMode=yes ubuntu@ssh.once.florent.cc list | grep -q "^$name"$'\t'; then
            ssh -o BatchMode=yes ubuntu@ssh.once.florent.cc "remove $name"
          else
            echo "Pas d'environnement $name."
          fi

      - name: Balayage des environnements de PR fermées
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number --jq '[.[] | "pr-\(.number)"] | join(",")')
          ssh -o BatchMode=yes ubuntu@ssh.once.florent.cc "sweep --keep $keep"
